<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed — GymScore</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <style>
        .feed-page { max-width: 640px; margin: 0 auto; padding: 0 0 24px; }

        .feed-header { padding: 20px 20px 0; background: linear-gradient(180deg, var(--accent-glow) 0%, transparent 100%); }
        .feed-header-row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .feed-saudacao { font-size: var(--fs-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
        .feed-nome { font-size: 1.6rem; font-weight: 800; letter-spacing: .02em; line-height: 1.1; overflow-wrap: anywhere; }
        .feed-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 800; flex-shrink: 0; }
        .feed-saldo-row { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
        .feed-saldo-link { color: var(--text); text-decoration: none; font-size: 1.9rem; font-weight: 800; min-height: var(--alvo); display: inline-flex; align-items: center; }
        .feed-eye-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; min-width: var(--alvo); min-height: var(--alvo); display: flex; align-items: center; justify-content: center; }
        .feed-elo-row { margin-bottom: 16px; }

        .feed-ctas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 20px; margin-bottom: 16px; }
        .feed-ctas .gs-btn { padding: 10px 4px; font-size: .8rem; white-space: normal; text-align: center; }

        .onboarding { margin: 0 20px 16px; padding: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); }
        .onboarding h2 { font-size: 1rem; margin-bottom: 4px; }
        .onboarding > p { font-size: .85rem; color: var(--text-muted); margin-bottom: 10px; }
        .onboarding ol { list-style: none; display: grid; gap: 8px; }
        .onboarding li { display: flex; align-items: center; gap: 10px; font-size: .9rem; }
        .onboarding .passo { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 800; }
        .onboarding li.feito .passo { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
        .onboarding li.feito span:last-child { color: var(--text-muted); text-decoration: line-through; }
        .onboarding a { color: var(--accent); font-weight: 600; min-height: var(--alvo); display: inline-flex; align-items: center; }

        .feed-search { padding: 0 20px; margin-bottom: 12px; }
        .feed-search .gs-input { background: var(--bg-card); border-radius: 30px; }
        .chips-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 8px; scrollbar-width: none; margin-bottom: 8px; }
        .chips-scroll::-webkit-scrollbar { display: none; }
        .chips-scroll .chip-categoria { flex-shrink: 0; }

        .feed-section { padding: 0 20px; }
        .feed-section-title { font-size: .8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }

        .recom-carousel { display: flex; gap: 12px; overflow-x: auto; padding: 0 20px 8px; scrollbar-width: none; margin-bottom: 20px; }
        .recom-carousel::-webkit-scrollbar { display: none; }
        .recom-card { flex-shrink: 0; width: 200px; display: block; color: inherit; text-decoration: none; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; transition: border-color .2s; }
        .recom-card:hover { border-color: var(--accent); }
        .recom-titulo { font-weight: 600; font-size: .9rem; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .recom-valor { color: var(--success-text); font-size: .82rem; font-weight: 700; margin-bottom: 6px; }
        .recom-razao { font-size: var(--fs-xs); color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .recom-carousel .gs-skeleton { flex-shrink: 0; width: 200px; margin: 0; }

        .desafios-lista { display: flex; flex-direction: column; gap: 14px; padding: 0 20px; }
        .lista-mais { text-align: center; margin: 16px 0 0; }
        .feed-estado { padding: 0 20px; }

        @media (min-width: 900px) {
            .feed-page { max-width: 900px; }
            .desafios-lista { display: grid; grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<main class="feed-page">
    <header class="feed-header">
        <div class="feed-header-row1">
            <div>
                <div class="feed-saudacao">Olá,</div>
                <div class="feed-nome" id="feedNome">...</div>
            </div>
            <div class="feed-avatar" id="feedAvatar" aria-hidden="true">?</div>
        </div>

        <div class="feed-saldo-row">
            <a class="feed-saldo-link" id="feedSaldo" href="/carteira" aria-label="Abrir carteira">R$ –</a>
            <button type="button" class="feed-eye-btn" id="btnOlho" aria-label="Mostrar ou ocultar saldo" aria-pressed="false">
                <svg id="saldoEyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
            </button>
        </div>

        <div class="feed-elo-row">
            <span class="elo-badge elo-iniciante" id="feedEloBadge">INICIANTE • 0 XP</span>
        </div>
    </header>

    <nav class="feed-ctas" aria-label="Atalhos">
        <a href="/depositar" class="gs-btn gs-btn-primary">Depositar</a>
        <a href="/carteira" class="gs-btn gs-btn-secondary">Carteira</a>
        <a href="/desafios?aba=meus" class="gs-btn gs-btn-secondary">Meus desafios</a>
        <a href="/treinos" class="gs-btn gs-btn-secondary">Treinos</a>
    </nav>

    <section id="onboarding" class="onboarding" aria-labelledby="onbTitulo" hidden></section>

    <div class="feed-search">
        <input type="search" class="gs-input" id="buscaInput" placeholder="Buscar por título, local ou academia"
               aria-label="Buscar desafios" maxlength="100" autocomplete="off">
    </div>

    <div class="chips-scroll" id="chips" role="group" aria-label="Filtrar por categoria"></div>

    <div class="feed-section">
        <div class="feed-section-title" id="recomTitulo">Sugeridos para você</div>
    </div>
    <div class="recom-carousel" id="recomCarousel" aria-labelledby="recomTitulo"></div>

    <div class="feed-section">
        <div class="feed-section-title" id="desafiosTitulo">Desafios abertos</div>
    </div>
    <div class="feed-estado" id="feedEstado"></div>
    <div class="desafios-lista" id="desafiosLista"></div>
    <div class="lista-mais" id="listaMais" hidden>
        <button type="button" class="gs-btn gs-btn-secondary" id="btnMais">Carregar mais</button>
    </div>
</main>

<script src="../js/api.js"></script>
<script>
    if (!Auth.require()) throw new Error('unauthenticated');
    checkLGPDConsent();

    var LIMITE = 10;
    var user = Auth.getUser() || {};
    var catAtiva = '';
    var pagina = 1;
    var total = 0;
    var qtd = 0;
    var seq = 0;
    var buscaTimer = null;
    var categorias = ['geral', 'corrida', 'musculacao', 'crossfit', 'funcional', 'ciclismo', 'natacao', 'calistenia', 'luta', 'outros'];
    var $ = function(id) { return document.getElementById(id); };

    if (user.perfil) document.body.dataset.perfil = user.perfil;

    // ── Cabeçalho ─────────────────────────────────────────────────────────────
    var _ELO_MAP = { iniciante: 'elo-iniciante', bronze: 'elo-bronze', prata: 'elo-prata', ouro: 'elo-ouro', diamante: 'elo-diamante', elite: 'elo-elite' };

    function renderHeader() {
        $('feedNome').textContent = (user.nome || 'Atleta').toUpperCase();
        $('feedAvatar').textContent = (user.nome || 'A').charAt(0).toUpperCase();
        renderSaldo();
        var elo = (user.elo || 'iniciante').toLowerCase();
        var badge = $('feedEloBadge');
        badge.className = 'elo-badge ' + (_ELO_MAP[elo] || 'elo-iniciante');
        badge.textContent = elo.toUpperCase() + ' • ' + (user.pontos || 0) + ' XP';
    }

    function renderSaldo() {
        var oculto = Privacy.isHidden();
        $('feedSaldo').textContent = oculto ? 'R$ •••' : fmtBRL(user.saldo_centavos);
        $('btnOlho').setAttribute('aria-pressed', oculto ? 'false' : 'true');
        var icone = $('saldoEyeIcon');
        icone.innerHTML = oculto // SVG estático, sem dado de usuário
            ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
            : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
    $('btnOlho').addEventListener('click', function() { Privacy.toggle(); });
    document.addEventListener('privacyChange', renderSaldo);

    renderHeader();
    Auth.refresh().then(function(fresh) {
        if (fresh) { user = fresh; renderHeader(); verificarOnboarding(); }
    });

    // ── Onboarding do primeiro acesso (saldo zerado e sem desafios) ──────────
    async function verificarOnboarding() {
        var box = $('onboarding');
        try {
            var res = await Promise.all([API.listarMeusDesafios({ limite: 1 }), API.listarAmigos()]);
            var temDesafio = ((res[0].data || {}).total || 0) > 0;
            var temAmigo = (res[1].data || []).some(function(a) { return a.status === 'aceita'; });
            var temSaldo = (user.saldo_centavos || 0) > 0;
            if (temDesafio) { box.hidden = true; return; }
            var passos = [
                { feito: temSaldo, texto: 'Deposite saldo via PIX', href: '/depositar', link: 'Depositar' },
                { feito: temAmigo, texto: 'Adicione um amigo', href: '/amigos', link: 'Buscar amigos' },
                { feito: false, texto: 'Entre num desafio abaixo', href: '#desafiosTitulo', link: 'Ver desafios' }
            ];
            limpar(box).appendChild(h('h2', { id: 'onbTitulo', text: 'Comece por aqui' }));
            box.appendChild(h('p', { text: 'Três passos para entrar no seu primeiro desafio.' }));
            box.appendChild(h('ol', null, passos.map(function(p, i) {
                return h('li', { class: p.feito ? 'feito' : null }, [
                    h('span', { class: 'passo', 'aria-hidden': 'true', text: p.feito ? '✓' : String(i + 1) }),
                    h('span', { text: p.texto + (p.feito ? ' (feito)' : '') }),
                    p.feito ? null : h('a', { href: p.href, text: p.link })
                ]);
            })));
            box.hidden = false;
        } catch (e) { box.hidden = true; }
    }
    verificarOnboarding();

    // ── Categorias e busca (filtros no servidor) ──────────────────────────────
    function renderChips() {
        var cont = limpar($('chips'));
        function chip(slug, rotulo) {
            return h('button', { type: 'button', class: 'chip-categoria' + (catAtiva === slug ? ' ativo' : ''), 'aria-pressed': catAtiva === slug ? 'true' : 'false',
                text: rotulo, onClick: function() { catAtiva = slug; renderChips(); carregar(true); } });
        }
        cont.appendChild(chip('', 'Todas'));
        categorias.forEach(function(c) { cont.appendChild(chip(c, rotuloCategoria(c))); });
    }
    API.categoriasDesafio().then(function(r) { if (r.data && r.data.length) { categorias = r.data; renderChips(); } }).catch(function() {});

    $('buscaInput').addEventListener('input', function() {
        clearTimeout(buscaTimer);
        buscaTimer = setTimeout(function() { carregar(true); }, 350);
    });
    $('btnMais').addEventListener('click', function() { carregar(false); });

    // ── Lista de desafios abertos (GET /desafios: envelope {itens,total,pagina,limite}) ──
    async function carregar(reiniciar) {
        var mine = ++seq;
        var q = $('buscaInput').value.trim();
        if (reiniciar) {
            pagina = 1; qtd = 0;
            limpar($('feedEstado'));
            Skeleton.cards($('desafiosLista'), 3, 150);
            $('listaMais').hidden = true;
        } else { pagina++; }
        try {
            var resp = await API.listarDesafios({ status: 'aberto', categoria: catAtiva, q: q, pagina: pagina, limite: LIMITE });
            if (mine !== seq) return;
            var dados = resp.data || {};
            var itens = dados.itens || [];
            total = dados.total || 0;
            var lista = $('desafiosLista');
            if (reiniciar) limpar(lista);
            lista.removeAttribute('aria-busy');
            itens.forEach(function(d) { lista.appendChild(cartaoDesafio(d)); });
            qtd += itens.length;
            $('listaMais').hidden = qtd >= total;
            $('desafiosTitulo').textContent = total + (total === 1 ? ' desafio aberto' : ' desafios abertos');
            if (qtd === 0) limpar($('feedEstado')).appendChild(vazio(q));
        } catch (e) {
            if (mine !== seq) return;
            if (!reiniciar) pagina--;
            if (reiniciar) limpar($('desafiosLista'));
            limpar($('feedEstado')).appendChild(estadoVazio({ erro: true, titulo: 'Não foi possível carregar os desafios',
                texto: mensagemErro(e), acao: { texto: 'Tentar de novo', onClick: function() { carregar(true); } } }));
        }
    }

    // Vazio diferente para "filtro zerou a lista" e "não há desafios"
    function vazio(q) {
        if (q || catAtiva) {
            return estadoVazio({ icone: '🔎', titulo: 'Nenhum desafio com esses filtros', texto: 'Tente outra categoria ou outro termo de busca.',
                acao: { texto: 'Limpar filtros', onClick: function() { $('buscaInput').value = ''; catAtiva = ''; renderChips(); carregar(true); } } });
        }
        return estadoVazio({ icone: '📅', titulo: 'Nenhum desafio aberto agora',
            texto: 'As academias publicam desafios com frequência. Enquanto isso, que tal montar um treino?',
            acao: { texto: 'Ir para os treinos', href: '/treinos' } });
    }

    // ── Sugeridos (heurística por histórico; a razão vem do backend) ─────────
    async function carregarSugeridos() {
        var car = $('recomCarousel');
        Skeleton.cards(car, 3, 110);
        try {
            var lista = (await API.recomendados()).data || [];
            limpar(car);
            car.removeAttribute('aria-busy');
            if (lista.length === 0) {
                car.appendChild(h('p', { class: 'gs-hint', style: { padding: '8px 0' }, text: 'Entre em desafios para receber sugestões personalizadas.' }));
                return;
            }
            lista.forEach(function(item) {
                var d = item.desafio;
                car.appendChild(h('a', { class: 'recom-card', href: '/desafios?id=' + encodeURIComponent(d.id) }, [
                    h('div', { class: 'recom-titulo', text: d.titulo }),
                    h('div', { class: 'recom-valor', text: d.valor_entrada_centavos > 0 ? 'Entrada ' + fmtBRL(d.valor_entrada_centavos) : 'Grátis' }),
                    h('div', { class: 'recom-razao', text: item.razao })
                ]));
            });
        } catch (e) { limpar(car); car.removeAttribute('aria-busy'); }
    }

    renderChips();
    carregar(true);
    carregarSugeridos();
    renderBottomNav('/menu');
</script>
</body>
</html>
