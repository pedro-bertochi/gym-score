<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de instrutor — GymScore</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/cadastro-instrutor.css">
</head>
<body data-perfil="instrutor">
<main class="instrutor-page">
    <h1>Cadastro de instrutor</h1>
    <p class="subtitle">Ative o perfil de instrutor na sua conta para se candidatar a vagas e monitorar desafios.</p>

    <div id="semLogin" hidden>
        <div class="gs-msg error show" role="alert">Entre na sua conta GymScore (ou crie uma) para ativar o perfil de instrutor.</div>
        <p style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
            <a href="/login" class="gs-btn gs-btn-primary">Entrar</a>
            <a href="/signup" class="gs-btn gs-btn-secondary">Criar conta</a>
        </p>
    </div>

    <form id="instrutorForm" novalidate hidden>
        <p class="gs-hint" id="contaInfo" style="margin-bottom:16px"></p>
        <div class="gs-field">
            <label class="gs-label" for="inputCREF">CREF (número de registro)</label>
            <input type="text" id="inputCREF" class="gs-input" data-mask="cref" placeholder="123456-G/SP" required>
            <p class="gs-hint" style="margin-top:6px">Seis números, a letra da categoria e a UF.</p>
        </div>
        <div class="gs-field">
            <label class="gs-label" for="inputEsp">Especialidade (opcional)</label>
            <input type="text" id="inputEsp" class="gs-input" maxlength="100" placeholder="Ex.: Musculação, Funcional, CrossFit">
        </div>
        <p id="formMsg" class="gs-msg" role="alert" style="margin-top:8px"></p>
        <button type="submit" class="gs-btn gs-btn-primary gs-btn-full" style="margin-top:20px" id="submitBtn">Ativar perfil de instrutor</button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:0.85em;color:var(--text-muted)">
        <a href="/perfil" class="gs-link" id="voltar">Voltar ao perfil</a>
    </p>
</main>

<script src="../js/api.js"></script>
<script>
    var logado = !!Auth.getToken();
    var usuario = Auth.getUser();
    document.getElementById('semLogin').hidden = logado;
    document.getElementById('instrutorForm').hidden = !logado;
    if (!logado) document.getElementById('voltar').setAttribute('href', '/login');
    if (logado && usuario) {
        document.getElementById('contaInfo').textContent = 'Conta: ' + nomeCompleto(usuario) + (usuario.email ? ' (' + usuario.email + ')' : '');
        if (usuario.perfil === 'instrutor') window.location.href = '/instrutor';
        if (usuario.perfil === 'academia') {
            document.getElementById('instrutorForm').hidden = true;
            var aviso = document.getElementById('semLogin');
            aviso.hidden = false;
            aviso.textContent = '';
            aviso.appendChild(h('div', { class: 'gs-msg error show', role: 'alert', text: 'Contas de academia não podem ser instrutor. Use uma conta de atleta.' }));
        }
    }

    document.getElementById('instrutorForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        var msgEl = document.getElementById('formMsg');
        var campoCref = document.getElementById('inputCREF');
        msgEl.classList.remove('show');

        var cref = campoCref.value.trim();
        if (!Valid.cref(cref)) { erroCampo(campoCref, 'Informe o CREF no formato 123456-G/SP.'); campoCref.focus(); return; }
        erroCampo(campoCref, '');

        btnLoading(btn, true);
        try {
            // Só CREF e especialidade: a identidade vem do token, e quem vincula à academia é a própria academia
            await API.cadastrarInstrutor({ cref: cref, especialidade: document.getElementById('inputEsp').value.trim() });
            // O perfil muda na hora no servidor: basta atualizar o cache local, sem novo login
            await Auth.refresh();
            showToast('Perfil de instrutor ativado!', 'success');
            setTimeout(function() { window.location.href = '/instrutor'; }, 900);
        } catch (err) {
            msgEl.className = 'gs-msg error show';
            msgEl.textContent = mensagemErro(err);
            btnLoading(btn, false);
        }
    });
</script>
</body>
</html>
