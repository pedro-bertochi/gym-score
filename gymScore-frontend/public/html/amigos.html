<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigos - GymScore</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/amigos.css">
</head>
<body>
    <div class="friends-container">
        <div class="gs-page-header" style="padding:0;margin-bottom:20px;">
            <h1>👥 Amigos</h1>
        </div>

        <!-- Busca de usuários para adicionar -->
        <div class="add-friend-section">
            <label class="gs-label" for="searchFriend">Adicionar amigo</label>
            <div class="search-wrapper">
                <input
                    type="text"
                    id="searchFriend"
                    class="gs-input"
                    placeholder="Buscar por nome ou e-mail..."
                    autocomplete="off"
                    aria-label="Buscar usuário por nome ou e-mail"
                    oninput="onSearchInput()"
                >
                <div class="search-results" id="searchResults" role="listbox" aria-label="Resultados da busca" hidden></div>
            </div>
            <div aria-live="polite" id="searchMsg" class="gs-msg" style="margin-top:8px;"></div>
        </div>

        <!-- Lista de amigos -->
        <div id="statusMsg" class="gs-msg" aria-live="polite" style="margin-bottom:12px;"></div>
        <ul class="friends-list" id="friendsList" aria-label="Lista de amigos"></ul>

        <!-- Empty state -->
        <div id="emptyState" class="empty-state" hidden>
            <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
                <circle cx="24" cy="22" r="10" stroke="currentColor" stroke-width="3"/>
                <circle cx="42" cy="22" r="10" stroke="currentColor" stroke-width="3"/>
                <path d="M4 54c0-11 9-20 20-20h16c11 0 20 9 20 20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <p class="empty-title">Você ainda não tem amigos aqui.</p>
            <p class="empty-sub">Adicione alguém pelo nome ou e-mail acima.</p>
        </div>
    </div>

<script src="../js/api.js"></script>
<script>
    if (!Auth.require()) throw new Error('unauthenticated');

    var currentUser = Auth.getUser();
    var allUsers = [];
    var searchTimeout = null;

    // ── Carrega lista de amigos ───────────────────────────────────────────────
    async function loadFriends() {
        var statusEl = document.getElementById('statusMsg');
        var listEl   = document.getElementById('friendsList');
        var emptyEl  = document.getElementById('emptyState');

        statusEl.className = 'gs-msg';
        statusEl.textContent = 'Carregando...';
        statusEl.classList.add('show');
        listEl.innerHTML = '';
        emptyEl.hidden = true;

        try {
            var resp = await API.listarAmigos(currentUser.id);
            var amigos = resp.data || [];
            statusEl.classList.remove('show');

            if (amigos.length === 0) {
                emptyEl.hidden = false;
                return;
            }

            amigos.forEach(function(a) {
                var nome = escHtml(((a.nome || '') + ' ' + (a.sobrenome || '')).trim() || 'Usuário');
                var email = escHtml(a.email || '');
                var id = a.id_usuario === currentUser.id ? a.id_amigo : a.id_usuario;
                var li = document.createElement('li');
                li.className = 'friend-item';
                li.innerHTML =
                    '<div class="friend-info">' +
                        '<span class="friend-name">' + nome + '</span>' +
                        (email ? '<span class="friend-email">' + email + '</span>' : '') +
                    '</div>' +
                    '<div class="friend-actions">' +
                        '<button onclick="removeFriend(' + id + ', this)" aria-label="Remover ' + nome + '">Remover</button>' +
                    '</div>';
                listEl.appendChild(li);
            });
        } catch (err) {
            statusEl.className = 'gs-msg error show';
            statusEl.textContent = 'Erro ao carregar amigos.';
        }
    }

    // ── Busca de usuários (debounce 300ms) ────────────────────────────────────
    function onSearchInput() {
        clearTimeout(searchTimeout);
        var q = document.getElementById('searchFriend').value.trim();
        if (q.length < 3) {
            hideResults();
            return;
        }
        searchTimeout = setTimeout(function() { buscarUsuarios(q); }, 300);
    }

    async function buscarUsuarios(q) {
        var resultsEl = document.getElementById('searchResults');
        resultsEl.innerHTML = '<div class="search-loading">Buscando...</div>';
        resultsEl.hidden = false;

        try {
            if (allUsers.length === 0) {
                var resp = await API.listarUsuarios();
                allUsers = resp.data || [];
            }

            var ql = q.toLowerCase();
            var filtrados = allUsers.filter(function(u) {
                if (u.id === currentUser.id) return false;
                var nome = ((u.nome || '') + ' ' + (u.sobrenome || '')).toLowerCase();
                var email = (u.email || '').toLowerCase();
                return nome.includes(ql) || email.includes(ql);
            });

            renderSearchResults(filtrados);
        } catch (err) {
            resultsEl.innerHTML = '<div class="search-empty">Erro ao buscar usuários.</div>';
        }
    }

    function renderSearchResults(lista) {
        var resultsEl = document.getElementById('searchResults');
        if (lista.length === 0) {
            resultsEl.innerHTML = '<div class="search-empty">Nenhum usuário encontrado.</div>';
            return;
        }
        resultsEl.innerHTML = '';
        lista.forEach(function(u) {
            var nome = escHtml(((u.nome || '') + ' ' + (u.sobrenome || '')).trim());
            var email = escHtml(u.email || '');
            var item = document.createElement('div');
            item.className = 'search-item';
            item.setAttribute('role', 'option');
            item.innerHTML =
                '<div class="search-item-info">' +
                    '<span class="search-item-name">' + nome + '</span>' +
                    '<span class="search-item-email">' + email + '</span>' +
                '</div>' +
                '<button class="search-item-add gs-btn gs-btn-primary" onclick="addFriend(' + u.id + ', this, \'' + nome + '\')" aria-label="Adicionar ' + nome + ' como amigo">Adicionar</button>';
            resultsEl.appendChild(item);
        });
    }

    function hideResults() {
        var resultsEl = document.getElementById('searchResults');
        resultsEl.hidden = true;
        resultsEl.innerHTML = '';
    }

    // Fechar dropdown ao clicar fora
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-wrapper')) hideResults();
    });

    // ── Adicionar amigo ──────────────────────────────────────────────────────
    async function addFriend(idAmigo, btn, nome) {
        btn.disabled = true;
        btn.textContent = '...';
        var msgEl = document.getElementById('searchMsg');
        msgEl.className = 'gs-msg';

        try {
            await API.adicionarAmigo(currentUser.id, idAmigo);
            showToast('Solicitação enviada para ' + nome + '!', 'success');
            hideResults();
            document.getElementById('searchFriend').value = '';
            allUsers = []; // Limpa cache para forçar rebusca
            loadFriends();
        } catch (err) {
            msgEl.className = 'gs-msg error show';
            msgEl.textContent = err.message;
            btn.disabled = false;
            btn.textContent = 'Adicionar';
        }
    }

    // ── Remover amigo ────────────────────────────────────────────────────────
    async function removeFriend(idAmigo, btn) {
        btn.disabled = true;
        try {
            await API.removerAmigo(currentUser.id, idAmigo);
            showToast('Amigo removido.', 'success');
            loadFriends();
        } catch (err) {
            showToast(err.message, 'error');
            btn.disabled = false;
        }
    }

    function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    loadFriends();
    renderBottomNav('/amigos');
</script>
</body>
</html>
