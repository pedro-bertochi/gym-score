<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D1117">
    <title>Depositar — GymScore</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <style>
        .wallet-page { max-width: 480px; margin: 0 auto; padding: 16px 20px 24px; }
        .page-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 16px; }

        .saldo-card { background: var(--bg-card); border: 1px solid var(--accent); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; position: relative; overflow: hidden; }
        .saldo-card::before { content: ''; position: absolute; inset: 0; background: var(--accent-glow); pointer-events: none; }
        .saldo-card > * { position: relative; }
        .saldo-card-label { font-size: var(--fs-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
        .saldo-card-row { display: flex; align-items: center; gap: 6px; }
        .saldo-value { font-size: 2.2rem; font-weight: 800; }
        .saldo-eye { background: none; border: none; color: var(--text-muted); cursor: pointer; min-width: var(--alvo); min-height: var(--alvo); display: flex; align-items: center; justify-content: center; }

        .valor-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
        .valor-chip { min-height: var(--alvo); padding: 12px 6px; background: var(--bg-surface); border: 1.5px solid var(--border); border-radius: var(--radius);
            color: var(--text); font-family: inherit; font-size: .85rem; font-weight: 700; cursor: pointer; text-align: center; transition: border-color .2s, background .2s; }
        .valor-chip[aria-pressed="true"], .valor-chip:hover { border-color: var(--accent); background: var(--accent-glow); }

        .campo-moeda { position: relative; }
        .campo-moeda span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
        .campo-moeda .gs-input { padding-left: 42px; }

        .qr-valor { text-align: center; font-size: 1.1rem; margin-top: 4px; }
        .qr-valor strong { font-size: 1.5rem; }
        .qr-validade { text-align: center; font-size: .85rem; color: var(--text-muted); }
        .qr-container { text-align: center; margin: 16px 0; }
        .qr-container img { width: 220px; height: 220px; border-radius: var(--radius-sm); border: 3px solid #fff; background: #fff; }
        .copy-btn { display: flex; align-items: center; gap: 8px; width: 100%; min-height: var(--alvo); padding: 12px; background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer; font-size: .82rem; font-family: inherit; margin: 10px 0; text-align: left; }
        .copy-btn .payload { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .copy-btn .acao { flex-shrink: 0; color: var(--accent); font-weight: 600; }
        .status-box { padding: 14px; border-radius: var(--radius-sm); background: var(--bg-surface); text-align: center; margin-top: 12px; font-size: .9rem; }
        .status-box.ok { background: rgba(34,197,94,.15); }
        .status-box.expirado { background: rgba(231,76,60,.15); }
        .acoes-col { display: grid; gap: 10px; margin-top: 12px; }

        .passo { display: none; }
        .passo.ativo { display: block; }
        .wallet-footer { text-align: center; margin-top: 28px; }
        .wallet-footer a { color: var(--text-muted); font-size: .85rem; display: inline-flex; align-items: center; min-height: var(--alvo); }
        .wallet-footer a:hover { color: var(--accent); }
    </style>
</head>
<body>

<main class="wallet-page">
    <a class="gs-voltar" id="linkVoltar" href="/menu">&larr; Voltar</a>
    <h1 class="page-title">Depositar</h1>

    <section class="saldo-card" aria-label="Saldo">
        <div class="saldo-card-label">Saldo disponível</div>
        <div class="saldo-card-row">
            <span class="saldo-value" id="walletSaldo">R$ –</span>
            <button type="button" class="saldo-eye" id="btnOlho" aria-label="Mostrar ou ocultar saldo">
                <svg id="eyeIconWallet" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
            </button>
        </div>
    </section>

    <!-- Passo 1: valor -->
    <form class="passo ativo" id="stepValor" novalidate>
        <div class="valor-chips" id="depChips" role="group" aria-label="Valores rápidos"></div>
        <div class="gs-field">
            <label class="gs-label" for="depValor">Valor do depósito</label>
            <div class="campo-moeda">
                <span aria-hidden="true">R$</span>
                <input type="text" id="depValor" class="gs-input" data-mask="moeda" data-max-centavos="100000000" placeholder="0,00" aria-describedby="depDica">
            </div>
            <p class="gs-hint" id="depDica" style="margin-top:6px;">Mínimo R$ 5,00. O PIX é confirmado em segundos.</p>
        </div>
        <div class="gs-field" id="campoCpf" hidden style="margin-top:14px;">
            <label class="gs-label" for="depCpf">CPF do pagador</label>
            <input type="text" id="depCpf" class="gs-input" data-mask="cpf" placeholder="000.000.000-00" aria-describedby="depCpfDica">
            <p class="gs-hint" id="depCpfDica" style="margin-top:6px;">Sua conta não tem CPF cadastrado. O PIX exige o CPF de quem paga.</p>
        </div>
        <p id="depMsg" class="gs-msg" role="alert" style="margin-top:8px;"></p>
        <button type="submit" class="gs-btn gs-btn-primary gs-btn-full" style="margin-top:16px;" id="btnGerarPix">Gerar QR Code PIX</button>
    </form>

    <!-- Passo 2: QR Code -->
    <section class="passo" id="stepQR" aria-label="Pagamento via PIX">
        <p class="qr-valor">Pague <strong id="qrValor">R$ 0,00</strong> via PIX</p>
        <p class="qr-validade" id="qrValidade"></p>
        <div class="qr-container"><img id="qrImg" alt="QR Code PIX para pagamento" width="220" height="220"></div>
        <button type="button" class="copy-btn" id="copyBtn" aria-label="Copiar código PIX copia e cola">
            <span class="payload" id="pixPayload">–</span><span class="acao">Copiar</span>
        </button>
        <div class="status-box" id="statusBox" role="status"><span id="statusText">Aguardando pagamento…</span></div>
        <div class="acoes-col">
            <a class="gs-btn gs-btn-primary" id="btnConcluido" href="/menu" hidden>Continuar</a>
            <button type="button" class="gs-btn gs-btn-primary" id="btnNovoQR" hidden>Gerar outro QR Code</button>
            <button type="button" class="gs-btn gs-btn-secondary" id="btnSimular" hidden>Simular pagamento (sandbox)</button>
            <button type="button" class="gs-btn gs-btn-secondary" id="btnTrocar">Alterar valor</button>
        </div>
    </section>

    <div class="wallet-footer">
        <a href="/carteira">Ver carteira, extrato e saque &rarr;</a>
    </div>
</main>

<script src="../js/api.js"></script>
<script>
    if (!Auth.require()) throw new Error('unauthenticated');
    checkLGPDConsent();

    var user = Auth.getUser() || {};
    if (user.perfil) document.body.dataset.perfil = user.perfil;

    var $ = function(id) { return document.getElementById(id); };
    var VALIDADE_MAX_MS = 15 * 60 * 1000; // teto do polling quando o backend não informa a expiração
    var chipCentavos = 0;
    var valorPixCentavos = 0;
    var asaasId = '';
    var pollTimer = null;
    var expiraEm = 0;
    var sandbox = false;

    // Retorno ao fluxo de origem (ex.: /depositar?voltar=/desafios?id=7). Só caminhos internos.
    var destino = (function() {
        var v = new URLSearchParams(location.search).get('voltar');
        return Notificacoes._linkSeguro(v) ? v : null;
    })();
    if (destino) {
        $('linkVoltar').href = destino;
        $('linkVoltar').textContent = '← Voltar ao que você estava fazendo';
        $('btnConcluido').href = destino;
        $('btnConcluido').textContent = 'Voltar e continuar';
    }

    fetch('/health').then(function(r) { return r.json(); }).then(function(d) { sandbox = !!d.asaas_teste; }).catch(function() {});

    // ── Saldo ─────────────────────────────────────────────────────────────────
    function renderSaldo() {
        var oculto = Privacy.isHidden();
        $('walletSaldo').textContent = oculto ? 'R$ •••' : fmtBRL(user.saldo_centavos);
        $('eyeIconWallet').innerHTML = oculto // SVG estático
            ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
            : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
    $('btnOlho').addEventListener('click', function() { Privacy.toggle(); });
    document.addEventListener('privacyChange', renderSaldo);
    renderSaldo();
    Auth.refresh().then(function(fresh) { if (fresh) { user = fresh; renderSaldo(); semCpf(); } });

    // Contas sem CPF (academia, instrutor) informam o CPF do pagador na hora; o PIX exige CPF válido
    function semCpf() { $('campoCpf').hidden = !!user.cpf; }
    semCpf();
    $('depCpf').addEventListener('blur', function() {
        erroCampo(this, this.value && !Valid.cpf(this.value) ? 'CPF inválido. Confira os dígitos.' : '');
    });

    // ── Valor ────────────────────────────────────────────────────────────────
    [25, 50, 100, 200].forEach(function(reais) {
        $('depChips').appendChild(h('button', { type: 'button', class: 'valor-chip', 'aria-pressed': 'false', text: 'R$ ' + reais,
            onClick: function() { selecionarChip(reais * 100, this); } }));
    });
    function selecionarChip(centavos, btn) {
        chipCentavos = centavos;
        document.querySelectorAll('#depChips .valor-chip').forEach(function(b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
        Mask.definirCentavos($('depValor'), centavos);
    }
    $('depValor').addEventListener('input', function() {
        chipCentavos = 0;
        document.querySelectorAll('#depChips .valor-chip').forEach(function(b) { b.setAttribute('aria-pressed', 'false'); });
    });

    function mostrarPasso(id) {
        document.querySelectorAll('.passo').forEach(function(p) { p.classList.toggle('ativo', p.id === id); });
        var t = id === 'stepQR' ? $('qrValor') : $('depValor');
        if (t && id === 'stepValor') t.focus();
    }

    // ── Gerar PIX (valor em centavos) ─────────────────────────────────────────
    $('stepValor').addEventListener('submit', async function(e) {
        e.preventDefault();
        var msg = $('depMsg');
        msg.className = 'gs-msg';
        var valor = Mask.centavos($('depValor'));
        if (valor < 500) { msg.className = 'gs-msg error show'; msg.textContent = 'O valor mínimo do depósito é R$ 5,00.'; return; }
        var cpf = user.cpf || $('depCpf').value;
        if (!Valid.cpf(cpf)) { msg.className = 'gs-msg error show'; msg.textContent = 'Informe um CPF válido para gerar o PIX.'; if (!user.cpf) $('depCpf').focus(); return; }
        var btn = $('btnGerarPix');
        btnLoading(btn, true);
        try {
            var d = (await API.gerarPix(valor, cpf)).data;
            asaasId = d.asaas_payment_id;
            valorPixCentavos = valor;
            $('qrImg').src = 'data:image/png;base64,' + d.qrcode_base64;
            $('pixPayload').textContent = d.payload;
            $('qrValor').textContent = fmtBRL(valor);
            var exp = d.expiration_date ? new Date(d.expiration_date).getTime() : NaN;
            expiraEm = (isFinite(exp) && exp > Date.now()) ? Math.min(exp, Date.now() + VALIDADE_MAX_MS) : Date.now() + VALIDADE_MAX_MS;
            $('qrValidade').textContent = 'Válido até ' + new Date(expiraEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            definirEstado('aguardando');
            mostrarPasso('stepQR');
            iniciarPolling();
        } catch (err) {
            msg.className = 'gs-msg error show';
            msg.textContent = mensagemErro(err);
        }
        btnLoading(btn, false);
    });

    function definirEstado(estado) {
        var box = $('statusBox');
        box.className = 'status-box' + (estado === 'ok' ? ' ok' : (estado === 'expirado' ? ' expirado' : ''));
        $('statusText').textContent = {
            aguardando: 'Aguardando pagamento…',
            ok: 'Pagamento confirmado! Saldo atualizado.',
            expirado: 'Este QR Code expirou. Gere outro para continuar.'
        }[estado];
        $('btnConcluido').hidden = estado !== 'ok';
        $('btnNovoQR').hidden = estado !== 'expirado';
        $('btnSimular').hidden = !(sandbox && estado === 'aguardando');
        $('btnTrocar').hidden = estado === 'ok';
        $('copyBtn').hidden = estado !== 'aguardando';
        if (estado === 'ok') $('btnConcluido').focus();
    }

    function pararPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

    async function verificar() {
        if (document.hidden || !asaasId) return; // pausa com a aba oculta; retoma no visibilitychange
        if (Date.now() > expiraEm) { pararPolling(); definirEstado('expirado'); return; }
        try {
            var r = await API.consultarPagamento(asaasId);
            if (r.data && r.data.status === 'received') {
                pararPolling();
                definirEstado('ok');
                var fresh = await Auth.refresh();
                if (fresh) { user = fresh; renderSaldo(); }
            }
        } catch (e) { /* silencioso: tenta de novo no próximo ciclo */ }
    }
    function iniciarPolling() { pararPolling(); pollTimer = setInterval(verificar, 4000); }
    document.addEventListener('visibilitychange', function() { if (!document.hidden && pollTimer) verificar(); });
    window.addEventListener('pagehide', pararPolling);

    $('btnSimular').addEventListener('click', async function() {
        btnLoading(this, true);
        try { await API.simularPagamento(asaasId); } catch (e) { /* silencioso */ }
        btnLoading(this, false);
        verificar();
    });
    $('copyBtn').addEventListener('click', function() {
        navigator.clipboard.writeText($('pixPayload').textContent)
            .then(function() { showToast('Código PIX copiado!', 'success'); })
            .catch(function() { showToast('Não foi possível copiar. Selecione o código manualmente.', 'error'); });
    });
    function voltarAoValor() { pararPolling(); asaasId = ''; mostrarPasso('stepValor'); }
    $('btnTrocar').addEventListener('click', voltarAoValor);
    $('btnNovoQR').addEventListener('click', voltarAoValor);

    renderBottomNav('/depositar');
</script>
</body>
</html>
