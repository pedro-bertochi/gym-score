basePath: /
definitions:
  models.AcademiaResumo:
    properties:
      id:
        type: integer
      nome_fantasia:
        type: string
    type: object
  models.AlterarSenhaRequest:
    properties:
      nova_senha:
        maxLength: 72
        minLength: 8
        type: string
      senha_atual:
        type: string
    required:
    - nova_senha
    - senha_atual
    type: object
  models.AmigoAlvoRequest:
    properties:
      id_amigo:
        type: integer
    required:
    - id_amigo
    type: object
  models.AsaasPaymentResponse:
    properties:
      billingType:
        type: string
      customer:
        type: string
      dueDate:
        type: string
      id:
        type: string
      status:
        type: string
      value:
        type: number
    type: object
  models.AsaasWebhookPayload:
    properties:
      event:
        type: string
      payment:
        $ref: '#/definitions/models.AsaasPaymentResponse'
    type: object
  models.AtualizarPerfilRequest:
    properties:
      genero:
        enum:
        - M
        - F
        - O
        type: string
      nome:
        maxLength: 100
        minLength: 2
        type: string
      sobrenome:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  models.AvaliarDesafioRequest:
    properties:
      nota:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - nota
    type: object
  models.CandidatarRequest:
    properties:
      lance_centavos:
        minimum: 0
        type: integer
      mensagem:
        maxLength: 500
        type: string
    type: object
  models.CandidatoResumo:
    properties:
      cref:
        type: string
      especialidade:
        type: string
      id:
        type: integer
      nome:
        type: string
      vinculado:
        description: vinculado a esta academia
        type: boolean
    type: object
  models.CandidaturaResponse:
    properties:
      atualizado_em:
        type: string
      criado_em:
        type: string
      id:
        type: integer
      id_desafio:
        type: integer
      instrutor:
        allOf:
        - $ref: '#/definitions/models.CandidatoResumo'
        description: só na lista da academia dona
      lance:
        type: number
      lance_centavos:
        type: integer
      mensagem:
        type: string
      status:
        type: string
    type: object
  models.ConvidarRequest:
    properties:
      id_amigo:
        type: integer
    required:
    - id_amigo
    type: object
  models.CriarAcademiaRequest:
    properties:
      cnpj:
        description: Aceita com ou sem pontuação
        type: string
      email:
        type: string
      endereco:
        type: string
      nome:
        maxLength: 100
        minLength: 2
        type: string
      nome_fantasia:
        maxLength: 150
        minLength: 2
        type: string
      razao_social:
        maxLength: 150
        minLength: 2
        type: string
      senha:
        minLength: 6
        type: string
      sobrenome:
        maxLength: 100
        type: string
      telefone:
        type: string
    required:
    - cnpj
    - email
    - nome
    - nome_fantasia
    - razao_social
    - senha
    type: object
  models.CriarDesafioRequest:
    properties:
      categoria:
        maxLength: 30
        type: string
      data_evento:
        description: |-
          DataEvento aceita RFC3339 ("2026-11-20T09:00:00-03:00") ou "YYYY-MM-DDTHH:MM" / "YYYY-MM-DD HH:MM"
          (horário local do servidor). Precisa estar no futuro.
        type: string
      descricao:
        maxLength: 2000
        type: string
      dividir_pote:
        type: boolean
      id_instrutor:
        description: |-
          Instrutor: instrutor_selecao "designado" (padrão; exige id_instrutor vinculado) ou "vaga_aberta"
          (sem id_instrutor; exige instrutor_teto_centavos; instrutores se candidatam com um lance <= teto).
          instrutor_modo_pagamento: fixo (padrão) | percentual | fixo_percentual.
        type: integer
      instrutor_fixo_centavos:
        maximum: 10000000
        minimum: 0
        type: integer
      instrutor_modo_pagamento:
        enum:
        - fixo
        - percentual
        - fixo_percentual
        type: string
      instrutor_pct:
        maximum: 100
        minimum: 0
        type: integer
      instrutor_selecao:
        enum:
        - designado
        - vaga_aberta
        type: string
      instrutor_teto_centavos:
        maximum: 10000000
        minimum: 0
        type: integer
      latitude:
        maximum: 90
        minimum: -90
        type: number
      local:
        maxLength: 200
        type: string
      longitude:
        maximum: 180
        minimum: -180
        type: number
      percentual_pote:
        maximum: 100
        minimum: 0
        type: integer
      posicoes_podio:
        maximum: 5
        minimum: 1
        type: integer
      premio_fixo_centavos:
        description: |-
          Premiação: prêmio fixo (reservado do saldo da academia) + parcela das inscrições (percentual_pote
          de T, se dividir_pote). dividir_pote omitido = true; percentual_pote omitido = o máximo permitido
          (100 - taxa da plataforma - instrutor_pct). Com dividir_pote=false, percentual_pote é gravado 0.
        maximum: 10000000
        minimum: 0
        type: integer
      titulo:
        maxLength: 200
        minLength: 3
        type: string
      vagas:
        maximum: 500
        minimum: 2
        type: integer
      valor_entrada_centavos:
        maximum: 1000000
        minimum: 0
        type: integer
    required:
    - data_evento
    - local
    - posicoes_podio
    - titulo
    - vagas
    type: object
  models.CriarInstrutorRequest:
    properties:
      cref:
        maxLength: 20
        minLength: 4
        type: string
      especialidade:
        maxLength: 100
        type: string
    required:
    - cref
    type: object
  models.CriarUsuarioRequest:
    properties:
      cpf:
        description: formato 000.000.000-00
        type: string
      data_nascimento:
        type: string
      email:
        maxLength: 150
        type: string
      genero:
        enum:
        - M
        - F
        - O
        type: string
      nome:
        maxLength: 100
        minLength: 2
        type: string
      senha:
        maxLength: 72
        minLength: 8
        type: string
      sobrenome:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - cpf
    - data_nascimento
    - email
    - genero
    - nome
    - senha
    - sobrenome
    type: object
  models.DashboardAcademiaResponse:
    properties:
      academia:
        $ref: '#/definitions/models.AcademiaResumo'
      avaliacao_media:
        description: AvaliacaoMedia (0 a 5, duas casas) considera só avaliações dos
          desafios desta academia.
        type: number
      avaliacoes_total:
        type: integer
      desafios_por_status:
        additionalProperties:
          format: int64
          type: integer
        type: object
      inscritos_mes:
        description: 'InscritosMes: inscrições feitas no mês corrente em desafios
          não cancelados da academia.'
        type: integer
      instrutores_vinculados:
        type: integer
      pote_em_jogo:
        type: number
      pote_em_jogo_centavos:
        description: 'PoteEmJogo: soma das entradas dos inscritos em desafios abertos
          ou em andamento.'
        type: integer
      proximos_eventos:
        description: 'ProximosEventos: até 5 desafios abertos com data_evento futura,
          do mais próximo ao mais distante.'
        items:
          $ref: '#/definitions/models.DesafioResponse'
        type: array
      taxa_presenca:
        description: |-
          TaxaPresenca é o percentual (0 a 100, uma casa) de inscritos presentes nos desafios em andamento
          e encerrados; 0 quando não há base.
        type: number
      total_desafios:
        description: TotalDesafios soma todos os status; DesafiosPorStatus sempre
          traz as 4 chaves (0 quando vazio).
        type: integer
    type: object
  models.DesafioResponse:
    properties:
      academia:
        allOf:
        - $ref: '#/definitions/models.AcademiaResumo'
        description: null só em legados
      categoria:
        type: string
      criado_em:
        type: string
      data_evento:
        description: null só em desafios legados
        type: string
      descricao:
        type: string
      financeiro:
        $ref: '#/definitions/models.FinanceiroResponse'
      id:
        type: integer
      instrutor:
        allOf:
        - $ref: '#/definitions/models.InstrutorResumo'
        description: null se sem instrutor (legados)
      instrutor_ganho:
        $ref: '#/definitions/models.GanhoInstrutorResponse'
      instrutor_selecao:
        type: string
      latitude:
        type: number
      local:
        type: string
      longitude:
        type: number
      participantes:
        items:
          $ref: '#/definitions/models.ParticipanteResponse'
        type: array
      participantes_count:
        type: integer
      pode_avaliar:
        type: boolean
      pode_cancelar:
        type: boolean
      pode_candidatar:
        description: |-
          PodeCandidatar: instrutor pode dar lance (vaga aberta, desafio aberto, evento futuro).
          PodeEscolherInstrutor: academia dona pode escolher entre os candidatos.
        type: boolean
      pode_editar:
        type: boolean
      pode_entrar:
        description: Flags de ação para o usuário logado
        type: boolean
      pode_escolher_instrutor:
        type: boolean
      pode_iniciar:
        type: boolean
      pode_lancar_podio:
        type: boolean
      pode_marcar_presenca:
        type: boolean
      pode_sair:
        type: boolean
      podio:
        items:
          $ref: '#/definitions/models.PodioResponse'
        type: array
      posicoes_podio:
        type: integer
      pote:
        type: number
      pote_centavos:
        type: integer
      premiacao:
        allOf:
        - $ref: '#/definitions/models.PremiacaoResponse'
        description: |-
          Premiacao (todos): prêmio total previsto + lista por posição. Financeiro só vai para a academia
          dona, InstrutorGanho para o instrutor designado e Vaga para instrutores (oferta da vaga aberta).
      premiacao_prevista_centavos:
        description: |-
          PremiacaoPrevistaCentavos tem posicoes_podio itens: a divisão do pote ATUAL pela tabela da
          quantidade de posições (se houver menos presentes que posições, os valores finais são renormalizados).
        items:
          type: integer
        type: array
      presentes_count:
        type: integer
      seu_codigo_ingresso:
        description: só para o próprio atleta inscrito
        type: string
      status:
        $ref: '#/definitions/models.StatusDesafio'
      titulo:
        type: string
      vaga:
        $ref: '#/definitions/models.VagaInstrutorResponse'
      vaga_instrutor_aberta:
        description: 'VagaInstrutorAberta: a vaga de instrutor segue aberta (sem escolhido);
          o desafio não pode ser iniciado.'
        type: boolean
      vagas:
        type: integer
      valor_entrada:
        type: number
      valor_entrada_centavos:
        type: integer
      voce_participa:
        description: Do usuário logado
        type: boolean
      voce_presente:
        type: boolean
    type: object
  models.EditarDesafioRequest:
    properties:
      categoria:
        maxLength: 30
        type: string
      data_evento:
        type: string
      descricao:
        maxLength: 2000
        type: string
      dividir_pote:
        type: boolean
      id_instrutor:
        minimum: 1
        type: integer
      instrutor_fixo_centavos:
        maximum: 10000000
        minimum: 0
        type: integer
      instrutor_modo_pagamento:
        enum:
        - fixo
        - percentual
        - fixo_percentual
        type: string
      instrutor_pct:
        maximum: 100
        minimum: 0
        type: integer
      instrutor_teto_centavos:
        maximum: 10000000
        minimum: 0
        type: integer
      latitude:
        maximum: 90
        minimum: -90
        type: number
      local:
        maxLength: 200
        minLength: 1
        type: string
      longitude:
        maximum: 180
        minimum: -180
        type: number
      percentual_pote:
        maximum: 100
        minimum: 0
        type: integer
      posicoes_podio:
        maximum: 5
        minimum: 1
        type: integer
      premio_fixo_centavos:
        description: |-
          Financeiro (mesmas regras da criação; a taxa da plataforma fica a do snapshot). Com atletas
          inscritos o prêmio só pode aumentar. Depois de escolhido o instrutor da vaga aberta, os campos
          instrutor_* ficam travados.
        maximum: 10000000
        minimum: 0
        type: integer
      titulo:
        maxLength: 200
        minLength: 3
        type: string
      vagas:
        maximum: 500
        minimum: 2
        type: integer
      valor_entrada_centavos:
        maximum: 1000000
        minimum: 0
        type: integer
    type: object
  models.EsqueciSenhaRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  models.FinanceiroResponse:
    properties:
      arrecadacao_centavos:
        description: entradas dos inscritos (T)
        type: integer
      candidaturas_pendentes:
        type: integer
      dividir_pote:
        type: boolean
      instrutor_fixo_centavos:
        type: integer
      instrutor_modo_pagamento:
        type: string
      instrutor_pct:
        type: integer
      instrutor_pct_centavos:
        type: integer
      instrutor_selecao:
        type: string
      instrutor_teto_centavos:
        type: integer
      instrutor_total_centavos:
        type: integer
      liquido_previsto_centavos:
        description: o que a academia recebe de volta no encerramento
        type: integer
      percentual_pote:
        type: integer
      pote_premio_centavos:
        description: parcela das inscrições que vai para os atletas
        type: integer
      premio_fixo_centavos:
        type: integer
      premio_total_centavos:
        type: integer
      reserva_centavos:
        description: garantia debitada do saldo da academia
        type: integer
      resultado_previsto_centavos:
        description: liquido - reserva (negativo = custo da academia)
        type: integer
      taxa_plataforma_centavos:
        type: integer
      taxa_plataforma_pct:
        type: integer
    type: object
  models.GanhoInstrutorResponse:
    properties:
      fixo_centavos:
        type: integer
      modo_pagamento:
        type: string
      pct:
        type: integer
      pct_centavos:
        description: previsto, sobre as inscrições atuais
        type: integer
      total_previsto_centavos:
        type: integer
    type: object
  models.HistoricoDesafioResponse:
    properties:
      academia:
        $ref: '#/definitions/models.AcademiaResumo'
      categoria:
        type: string
      criado_em:
        type: string
      data_encerramento:
        type: string
      data_evento:
        type: string
      id:
        type: integer
      local:
        type: string
      marca:
        type: string
      participantes_count:
        type: integer
      posicao:
        description: Posicao/Marca vêm do pódio; null/"" quando o usuário ficou fora
          do pódio.
        type: integer
      premio:
        type: number
      premio_centavos:
        type: integer
      presente:
        description: 'Presente: o usuário esteve no evento (só presentes entram no
          pódio).'
        type: boolean
      status:
        $ref: '#/definitions/models.StatusDesafio'
      titulo:
        type: string
      valor_entrada:
        type: number
      valor_entrada_centavos:
        type: integer
      vencedor:
        description: 1º colocado
        type: boolean
    type: object
  models.IngressoResponse:
    properties:
      academia:
        allOf:
        - $ref: '#/definitions/models.AcademiaResumo'
        description: null só em legados
      categoria:
        type: string
      codigo_ingresso:
        description: 'CodigoIngresso é o conteúdo do QR (32 hex): o mesmo `seu_codigo_ingresso`
          do desafio.'
        type: string
      data:
        description: Data é a data do evento (data_evento); null só em desafios legados
          sem data.
        type: string
      id_desafio:
        type: integer
      local:
        type: string
      presente:
        type: boolean
      presente_em:
        type: string
      status:
        type: string
      titulo:
        type: string
      valor_entrada_centavos:
        type: integer
    type: object
  models.InstrutorResponse:
    properties:
      autonomo:
        description: true = sem vínculo com academia
        type: boolean
      cref:
        type: string
      especialidade:
        type: string
      id:
        type: integer
      nome:
        type: string
      sobrenome:
        type: string
    type: object
  models.InstrutorResumo:
    properties:
      id:
        type: integer
      nome:
        type: string
    type: object
  models.InstrutorVinculadoResponse:
    properties:
      cref:
        type: string
      desafios_ativos:
        description: desafios abertos ou em andamento em que ele é o instrutor
        type: integer
      email:
        type: string
      especialidade:
        type: string
      id:
        type: integer
      id_usuario:
        type: integer
      nome:
        type: string
      sobrenome:
        type: string
    type: object
  models.LancarPodioRequest:
    properties:
      posicoes:
        items:
          $ref: '#/definitions/models.PodioEntrada'
        maxItems: 5
        minItems: 1
        type: array
    required:
    - posicoes
    type: object
  models.ListaDesafiosResponse:
    properties:
      itens:
        items:
          $ref: '#/definitions/models.DesafioResponse'
        type: array
      limite:
        type: integer
      pagina:
        type: integer
      total:
        type: integer
    type: object
  models.ListaInstrutoresVinculadosResponse:
    properties:
      itens:
        items:
          $ref: '#/definitions/models.InstrutorVinculadoResponse'
        type: array
      limite:
        type: integer
      pagina:
        type: integer
      total:
        type: integer
    type: object
  models.LoginRequest:
    properties:
      email:
        type: string
      senha:
        type: string
    required:
    - email
    - senha
    type: object
  models.PIXRequest:
    properties:
      cpf:
        example: 123.456.789-00
        type: string
      valor_centavos:
        example: 5000
        maximum: 100000000
        minimum: 500
        type: integer
    required:
    - cpf
    - valor_centavos
    type: object
  models.ParticipanteResponse:
    properties:
      id:
        type: integer
      nome:
        type: string
      premio:
        type: number
      premio_centavos:
        type: integer
      presente:
        type: boolean
      presente_em:
        type: string
      sobrenome:
        type: string
      vencedor:
        type: boolean
    type: object
  models.PodioEntrada:
    properties:
      id_participante:
        type: integer
      marca:
        maxLength: 50
        type: string
    required:
    - id_participante
    - marca
    type: object
  models.PodioResponse:
    properties:
      id_participante:
        type: integer
      marca:
        type: string
      nome:
        type: string
      posicao:
        type: integer
      premio:
        type: number
      premio_centavos:
        type: integer
      sobrenome:
        type: string
    type: object
  models.PremiacaoResponse:
    properties:
      por_posicao_centavos:
        items:
          type: integer
        type: array
      premio_total:
        type: number
      premio_total_centavos:
        type: integer
    type: object
  models.PresencaRequest:
    properties:
      codigo_ingresso:
        maxLength: 64
        type: string
      id_usuario:
        type: integer
    type: object
  models.RedefinirSenhaRequest:
    properties:
      nova_senha:
        maxLength: 72
        minLength: 8
        type: string
      token:
        maxLength: 200
        minLength: 20
        type: string
    required:
    - nova_senha
    - token
    type: object
  models.SaqueRequest:
    properties:
      chave_pix:
        maxLength: 140
        minLength: 3
        type: string
      tipo_chave:
        enum:
        - CPF
        - CNPJ
        - EMAIL
        - PHONE
        - EVP
        type: string
      valor_centavos:
        maximum: 1000000
        minimum: 500
        type: integer
    required:
    - chave_pix
    - tipo_chave
    - valor_centavos
    type: object
  models.StatusDesafio:
    enum:
    - aberto
    - em_andamento
    - encerrado
    - cancelado
    type: string
    x-enum-varnames:
    - StatusAberto
    - StatusEmAndamento
    - StatusEncerrado
    - StatusCancelado
  models.VagaInstrutorResponse:
    properties:
      minha_candidatura:
        $ref: '#/definitions/models.CandidaturaResponse'
      modo_pagamento:
        type: string
      pct:
        type: integer
      teto_centavos:
        type: integer
    type: object
  models.VincularInstrutorRequest:
    properties:
      email:
        maxLength: 150
        type: string
    required:
    - email
    type: object
  utils.APIResponse:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:3000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API para o sistema GymScore de desafios e treinos.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: GymScore API
  version: "1.0"
paths:
  /api/academia/dashboard:
    get:
      description: 'Indicadores só da academia logada: desafios por status, inscritos
        no mês, pote em jogo, taxa de presença, avaliação média e próximos eventos.
        Exige perfil academia.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.DashboardAcademiaResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Dashboard da academia
      tags:
      - academia
  /api/academia/desafios:
    get:
      description: Lista paginada dos desafios da academia logada, com filtro opcional
        de status. Exige perfil academia.
      parameters:
      - description: aberto | em_andamento | encerrado | cancelado
        in: query
        name: status
        type: string
      - description: Página (1..)
        in: query
        name: pagina
        type: integer
      - description: Itens por página (padrão 20, máx. 100)
        in: query
        name: limite
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
