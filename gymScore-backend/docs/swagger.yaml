        Não aceita id_usuario nem id_academia: o vínculo com a academia é feito por
        ela em POST /api/academia/instrutores. Só contas de atleta, sem inscrição
        em desafio aberto/em andamento. O perfil muda na hora (não precisa novo login).'
      parameters:
      - description: CREF e especialidade
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CriarInstrutorRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.InstrutorResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Tornar-se instrutor
      tags:
      - instrutores
  /api/login:
    post:
      consumes:
      - application/json
      description: Valida credenciais e retorna token JWT (24h) via JSON e Cookie
        HttpOnly
      parameters:
      - description: Credenciais de acesso
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Autenticar usuário
      tags:
      - usuarios
  /api/logout:
    post:
